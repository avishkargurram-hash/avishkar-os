<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Layla</title>
<style>
  :root{--ink:#e9edf4;--muted:#8790a1;--line:#1a2130;--teal:#35e0c8;--blue:#4a9eff}
  *{box-sizing:border-box}
  body{margin:0;padding:0;overflow:hidden;background:#000;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none}
  canvas{display:block;position:absolute;top:0;left:0;width:100vw;height:100vh;object-fit:contain}
  #threeCanvas{z-index:2;pointer-events:none}
  #loader{position:absolute;color:#0df;font-size:22px;text-align:center;width:100%;top:46%;z-index:10}
  #loadText{font-size:15px;color:#aaa}
  #hud-stub{position:absolute;opacity:0;pointer-events:none}
  .brand{position:fixed;top:18px;left:0;right:0;text-align:center;z-index:6;font-weight:700;letter-spacing:.4em;font-size:13px;text-transform:uppercase;color:var(--teal);text-shadow:0 0 18px rgba(53,224,200,.5)}
  .status{position:fixed;top:40px;left:0;right:0;text-align:center;z-index:6;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .caption{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);width:min(720px,88vw);text-align:center;z-index:6;pointer-events:none}
  .you{font-size:14px;color:var(--muted);min-height:20px;margin-bottom:8px;text-shadow:0 2px 10px #000}.you .live{color:var(--blue)}
  .layla{font-size:19px;line-height:1.5;color:#fff;max-height:30vh;overflow-y:auto;scrollbar-width:none;text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .layla::-webkit-scrollbar{display:none}
  /* Guaranteed-clickable fallback for open_url actions -- window.open() after
     an await often loses the browser's user-activation window and gets
     silently blocked, so a real link is always shown too (pointer-events
     re-enabled here since .caption itself is pointer-events:none). */
  .actionlinks{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
  .action-link{display:inline-block;background:rgba(53,224,200,.14);border:1px solid rgba(53,224,200,.4);color:#5be8c8;
    padding:7px 15px;border-radius:999px;font-size:13px;text-decoration:none;backdrop-filter:blur(6px)}
  .action-link:hover{background:rgba(53,224,200,.24)}
  .dock{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:7}
  .mic{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;position:relative;background:radial-gradient(circle at 50% 35%,#16b8a4,#0c7d70);color:#02110e;box-shadow:0 8px 30px rgba(0,0,0,.6);transition:transform .15s}
  .mic:hover{transform:scale(1.05)}
  .mic.live{background:radial-gradient(circle at 50% 35%,#5aa8ff,#2d6fd0);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,158,255,.45),0 8px 30px rgba(0,0,0,.6)}70%{box-shadow:0 0 0 18px rgba(74,158,255,0),0 8px 30px rgba(0,0,0,.6)}100%{box-shadow:0 0 0 0 rgba(74,158,255,0)}}
  .mic svg{width:26px;height:26px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .composer{display:flex;align-items:center;background:rgba(10,14,22,.55);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;width:min(420px,72vw);backdrop-filter:blur(8px)}
  .composer input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:15px;font-family:inherit}
  .composer input::placeholder{color:var(--muted)}
  .composer button{background:var(--teal);color:#04120f;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
  .home{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#4a5364;z-index:6}.home a{color:var(--muted)}

  /* ---- hamburger + drawer ---- */
  .hamburger{position:fixed;top:16px;left:16px;z-index:8;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
    background:rgba(10,14,22,.6);backdrop-filter:blur(6px);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .hamburger svg{width:20px;height:20px}
  .hamburger:hover{border-color:var(--teal)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(380px,86vw);background:#0b0f16;border-right:1px solid var(--line);
    z-index:10;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;color:var(--ink);
    font-size:14px}
  .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .drawer-title{font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--teal)}
  .drawer-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;width:28px;height:28px}
  .drawer-close:hover{color:var(--ink)}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 0 20px}
  .drawer-loading{padding:24px 18px;color:var(--muted)}
  .dsec{border-bottom:1px solid var(--line)}
  .dsec-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer}
  .dsec-head:hover{background:rgba(255,255,255,.03)}
  .dsec-title{display:flex;align-items:center;gap:9px;font-weight:600}
  .dsec-caret{color:var(--muted);font-size:11px;transition:transform .18s}
  .dsec.open .dsec-caret{transform:rotate(90deg)}
  .dsec-body{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .dsec.open .dsec-body{max-height:600px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px 8px 32px}
  .row-name{color:#c8ceda;font-size:13px}
  .row-detail{color:var(--muted);font-size:11.5px;padding:0 18px 10px 32px;margin-top:-6px;line-height:1.4}
  .pill{font-size:10.5px;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:600;border:1px solid transparent}
  .pill.connected{color:#5be8c8;background:rgba(53,224,200,.12);border-color:rgba(53,224,200,.3)}
  .pill.offline,.pill.disconnected{color:#8790a1;background:rgba(135,144,161,.1);border-color:rgba(135,144,161,.25)}
  .pill.authentication_required,.pill.permission_required{color:#ffcf6b;background:rgba(255,178,62,.12);border-color:rgba(255,178,62,.3)}
  .pill.error{color:#ff8f8f;background:rgba(255,90,90,.12);border-color:rgba(255,90,90,.3)}
  .pill.disabled{color:#5b6270;background:rgba(90,96,110,.12);border-color:rgba(90,96,110,.25)}
  .mini-stat{padding:8px 18px 8px 32px;color:var(--muted);font-size:12.5px}
  .mini-stat b{color:var(--ink)}
  .empty-note{padding:10px 18px 14px 32px;color:#5b6472;font-size:12.5px;font-style:italic}
  .tool-chip{display:inline-block;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;
    padding:3px 8px;margin:3px 4px 0 0;font-size:11px;color:#b8c0cc;font-family:ui-monospace,monospace}
  .drawer-foot{padding:12px 18px;border-top:1px solid var(--line)}
  .refresh-btn{width:100%;background:rgba(53,224,200,.08);border:1px solid rgba(53,224,200,.3);color:var(--teal);
    border-radius:8px;padding:9px;font-size:12.5px;cursor:pointer;letter-spacing:.03em}
  .refresh-btn:hover{background:rgba(53,224,200,.15)}
  .refresh-btn.spinning{opacity:.6;pointer-events:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
  <button class="hamburger" id="hamburger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand">Layla</div>
  <div class="status" id="statusEl"></div>
  <div id="loader">Waking Layla…<br><span id="loadText">Loading face…</span></div>
  <canvas id="faceCanvas"></canvas>
  <canvas id="threeCanvas"></canvas>
  <!-- stubs face.js may reference (kept invisible) -->
  <div id="hud-stub"><span id="g-status"></span><span id="g-state"></span><span id="g-network-icon"></span><span id="g-voice-icon"></span><span id="g-mic-icon"></span><span id="g-camera-icon"></span></div>

  <div class="caption"><div class="you" id="you"></div><div class="layla" id="layla">Tap the mic to go hands-free, then just say “Hey Layla” — or type below.</div><div class="actionlinks" id="actionLinks"></div></div>
  <div class="dock">
    <button class="mic" id="mic" aria-label="Talk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v5.5A3.5 3.5 0 0 0 12 15Z"/><path d="M18 11.5a6 6 0 0 1-12 0M12 17.5V21" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
    <form class="composer" id="composer"><input id="text" placeholder="Type a message…" autocomplete="off"><button type="submit">↑</button></form>
  </div>
  <div class="home"><a href="/">← home</a> · Layla · powered by Avishkar OS</div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <span class="drawer-title">☰ LAYLA</span>
      <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody">
      <div class="drawer-loading" id="drawerLoading">Reading live status…</div>
    </div>
    <div class="drawer-foot"><button class="refresh-btn" id="refreshState">↻ Refresh status</button></div>
  </aside>

  <!-- suppress face.js's own HUD drawing (it checks this flag, set by the old WS client) -->
  <script>window.__genesis_ws_active = true;</script>
  <!-- Genesis face engine (drives real-face render + emotion layers) -->
  <script type="module" src="/face/face.js"></script>
  <!-- Layla HUD overlay: the header text is baked into face.png, so this
       lays live plates over it. Remove this one line to revert. -->
  <script src="/face/hud.js"></script>

  <script>
  /* ================= Layla driver — voice loop drives the Genesis face ================= */
  const $=id=>document.getElementById(id);
  const statusEl=$('statusEl'), youEl=$('you'), laylaEl=$('layla'), micBtn=$('mic');
  function face(fn,arg){ try{ if(window[fn]) window[fn](arg); }catch(e){} }
  const S={idle:['Idle','IDLE'],listening:['Listening','LISTENING'],thinking:['Thinking','THINKING'],speaking:['Speaking','SPEAKING']};
  let state='idle';
  function setState(s){ state=s; statusEl.textContent=S[s][0]; face('setState',S[s][1]); }

  // hide loader once face.js has the face up (it flips #loader text / sets window.setState)
  const loaderPoll=setInterval(()=>{ if(window.setState){ $('loader').style.display='none'; clearInterval(loaderPoll); setState('idle'); } },400);

  /* ---- audio + lipsync ---- */
  let audioCtx,activeAnalyser=null,freq=new Uint8Array(128),visemeTimer=0,muteUntil=0;
  function ac(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
  const OPEN=['A','O','U','E'];
  /* CAPS-3-11 #4: viseme from the audio spectrum, not a random pick. Bins are
     ~sampleRate/256 wide (~187 Hz at 48 kHz): low = jaw/round vowels (O,U),
     mid = open/spread vowels (A,E), high = sibilants (S/F). */
  function visemeFor(a){
    if(a<0.045) return 'M';
    const n=freq.length, hz=(ac().sampleRate/2)/n;
    let lo=0,mid=0,hi=0;
    for(let i=0;i<n;i++){ const f=i*hz, v=freq[i];
      if(f<800) lo+=v; else if(f<2600) mid+=v; else if(f<8000) hi+=v; }
    const t=lo+mid+hi+1e-6, h=hi/t, l=lo/t;
    if(h>0.42) return a>0.2?'S':'F';
    if(l>0.62) return a>0.2?'O':'U';
    if(a<0.12) return 'N';
    return a>0.24?'A':'E';
  }
  function lipLoop(ts){ if(!activeAnalyser)return;
    activeAnalyser.getByteFrequencyData(freq); let s=0;for(let i=0;i<freq.length;i++)s+=freq[i]; const amp=(s/freq.length)/255;
    if(ts-visemeTimer>70){ visemeTimer=ts; face('setViseme',visemeFor(amp)); }
    requestAnimationFrame(lipLoop);
  }
  // speak() is a real Promise now -- it resolves only when the audio actually
  // finishes, so callers can `await` it and know Layla is truly done talking
  // before anything else (a new recognition result, a chained camera-look)
  // is allowed to proceed. This is what closes the double-voice bug: before,
  // ask()/captureAndSee() fired speak() and moved on immediately, so a second
  // response could start talking while the first was still playing.
  const TONE_FACE={warm:'content',playful:'smile',excited:'excited',calm:'content',serious:'neutral',sympathetic:'concerned'};
  let listenFace='';
  function settleFace(){ face('setEmotion', listenFace||'idle'); }
  function speak(text, tone){
    face('setEmotion', TONE_FACE[tone]||'content');
    return new Promise(async (resolve)=>{
      try{
        const r=await fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text, tone})});
        if(!r.ok)throw 0; const buf=await r.arrayBuffer(); const ab=await ac().decodeAudioData(buf);
        const src=ac().createBufferSource();src.buffer=ab;const an=ac().createAnalyser();an.fftSize=256;freq=new Uint8Array(an.frequencyBinCount);
        src.connect(an);an.connect(ac().destination);
        src.onended=()=>{activeAnalyser=null;face('setViseme','M');setState('idle');settleFace();muteUntil=Date.now()+800;resolve();};
        setState('speaking'); activeAnalyser=an; visemeTimer=0; requestAnimationFrame(lipLoop); src.start();
      }catch(e){
        try{const u=new SpeechSynthesisUtterance(text);u.onstart=()=>setState('speaking');
          u.onend=()=>{setState('idle');muteUntil=Date.now()+800;resolve();};speechSynthesis.speak(u);}
        catch(_){setState('idle');resolve();}
      }
    });
  }

  // true from the moment a request starts until Layla has fully finished
  // responding (including a chained camera-look) -- ANY recognition result
  // that arrives while this is true is ignored, not just while state=='speaking'.
  let busy = false;

  /* ---- browser actions Layla's brain asks the page to perform ---- */
  const actionLinksEl = $('actionLinks');
  function runActions(actions){
    if(actionLinksEl) actionLinksEl.innerHTML = '';
    if(!actions||!actions.length) return;
    for(const a of actions){
      if(a.type==='open_url'){
        // A fixed target name (not '_blank') means the browser reuses the
        // SAME tab for every open_url action instead of stacking a new one
        // each time -- "open YouTube", then "search X", then "open Y" now
        // all land in one Layla-driven tab instead of piling up 3 windows.
        try{ window.open(a.url,'layla-browser-tab'); }catch(e){}
        // window.open() above is frequently silently blocked here -- this
        // runs after `await fetch('/ask')`, and by then the browser's
        // transient user-activation from the original tap/click has often
        // expired (voice-triggered requests never had one to begin with).
        // There's no reliable way to detect a blocked popup after the fact,
        // so always render a real, guaranteed-clickable link too.
        if(actionLinksEl){
          const link=document.createElement('a');
          link.href=a.url; link.target='layla-browser-tab'; link.rel='noopener';
          link.className='action-link';
          try{ link.textContent='↗ Open '+new URL(a.url).hostname.replace(/^www\./,''); }
          catch(e){ link.textContent='↗ Open link'; }
          actionLinksEl.appendChild(link);
        }
      }
    }
  }
  // Shared by both look_through_camera (/see, casual glance) and
  // read_text_in_view (/ocr, accurate text reading) -- same webcam capture,
  // different backend endpoint depending on which the brain asked for.
  async function captureAndPerceive(question, endpoint){
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{width:480,height:360}});
      const v = document.createElement('video'); v.srcObject = stream; v.playsInline = true;
      await v.play();
      await new Promise(r=>setTimeout(r,180));  // let exposure settle for one frame
      const cv = document.createElement('canvas'); cv.width=v.videoWidth||480; cv.height=v.videoHeight||360;
      cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
      const dataUrl = cv.toDataURL('image/jpeg',0.82);
      stream.getTracks().forEach(t=>t.stop());  // camera light off immediately -- on-demand only
      const b64 = dataUrl.split(',')[1];
      const r = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,question})});
      const d = await r.json();
      const ans = d.answer || d.error || "I couldn't quite make that out.";
      laylaEl.textContent = ans; await speak(ans);
    }catch(e){
      if(stream) try{stream.getTracks().forEach(t=>t.stop());}catch(_){}
      const msg = "I don't have camera access — allow it in the browser and try again.";
      laylaEl.textContent = msg; await speak(msg);
    }
  }
  // Same capture mechanism as captureAndPerceive above, but for the two
  // face-recognition endpoints, which take different POST fields than
  // {image, question} (enroll_face needs a name, recognize_face needs
  // nothing extra) -- kept as its own function rather than generalizing
  // captureAndPerceive, deliberately, so the already-proven look/ocr path
  // above is not touched by this change at all.
  async function captureAndSendFace(endpoint, extraFields){
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{width:480,height:360}});
      const v = document.createElement('video'); v.srcObject = stream; v.playsInline = true;
      await v.play();
      await new Promise(r=>setTimeout(r,180));
      const cv = document.createElement('canvas'); cv.width=v.videoWidth||480; cv.height=v.videoHeight||360;
      cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
      const dataUrl = cv.toDataURL('image/jpeg',0.82);
      stream.getTracks().forEach(t=>t.stop());
      const b64 = dataUrl.split(',')[1];
      const r = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({image:b64}, extraFields))});
      const d = await r.json();
      const ans = d.answer || d.error || "I couldn't quite make that out.";
      laylaEl.textContent = ans; await speak(ans);
    }catch(e){
      if(stream) try{stream.getTracks().forEach(t=>t.stop());}catch(_){}
      const msg = "I don't have camera access — allow it in the browser and try again.";
      laylaEl.textContent = msg; await speak(msg);
    }
  }
  // Room scan. Separate from captureAndSendFace on purpose: it needs a far
  // higher resolution and a longer warm-up, and the existing single-face path
  // is already proven -- this must not disturb it.
  async function captureRoom(){
    let stream;
    try{
      // Ask for 1080p and accept whatever the camera actually gives. Face
      // size is the whole ballgame here: the server downscales to 1920 wide
      // anyway, so there is nothing to gain above that.
      stream = await navigator.mediaDevices.getUserMedia({
        video:{width:{ideal:1920}, height:{ideal:1080}}});
      const v = document.createElement('video'); v.srcObject = stream; v.playsInline = true; v.muted = true;
      await v.play();
      // Webcams open dark and sharpen over the first few frames; grabbing
      // immediately gives a murky frame with no detectable faces in it.
      await new Promise(r=>setTimeout(r,650));
      const cv = document.createElement('canvas');
      cv.width = v.videoWidth||1280; cv.height = v.videoHeight||720;
      cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
      const dataUrl = cv.toDataURL('image/jpeg',0.90);
      stream.getTracks().forEach(t=>t.stop());
      console.log('[ROOM SCAN] captured', cv.width+'x'+cv.height);
      const b64 = dataUrl.split(',')[1];
      const r = await fetch('/scan_room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64})});
      const d = await r.json();
      const ans = d.answer || d.error || "I couldn't get a clear look at the room.";
      laylaEl.textContent = ans; await speak(ans);
    }catch(e){
      if(stream) try{stream.getTracks().forEach(t=>t.stop());}catch(_){}
      const msg = "I couldn't get to the camera just now, so I can't tell you who's here.";
      laylaEl.textContent = msg; await speak(msg);
    }
  }

  // Voice-recognition capture (Phase D). Deliberately independent of the
  // "Hey Layla" continuous SpeechRecognition (rec) above -- this function
  // never touches rec, onresult, or mergeFinal at all, so it cannot
  // regress tonight's transcription fixes. Uses the Web Audio API to
  // capture raw PCM (not MediaRecorder's compressed webm/opus output)
  // because the backend expects a plain WAV file -- this avoids needing a
  // server-side audio decoder (ffmpeg) entirely.
  function bytesToBase64(bytes){
    // Chunked on purpose: spreading a large typed array directly into
    // String.fromCharCode(...bytes) blows past the JS engine's max
    // call-arguments limit for anything more than a couple seconds of
    // audio. 0x8000 stays safely under that limit on every browser.
    let binary = '';
    const chunkSize = 0x8000;
    for(let i=0;i<bytes.length;i+=chunkSize){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
    }
    return btoa(binary);
  }
  function encodeWav(samples, sampleRate){
    const buffer = new ArrayBuffer(44 + samples.length*2);
    const view = new DataView(buffer);
    function writeString(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
    writeString(0,'RIFF'); view.setUint32(4, 36+samples.length*2, true);
    writeString(8,'WAVE'); writeString(12,'fmt ');
    view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate*2, true);
    view.setUint16(32,2,true); view.setUint16(34,16,true);
    writeString(36,'data'); view.setUint32(40, samples.length*2, true);
    let offset=44;
    for(let i=0;i<samples.length;i++){
      let s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
      offset+=2;
    }
    return new Uint8Array(buffer);
  }
  async function captureAudioAndSend(endpoint, extraFields){
    let stream, audioCtx, source, processor;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    console.log('[stt] mic open, rate', c.sampleRate);
  }
  function sttTrackLost(){
    const t = Date.now(); sttRestarts = sttRestarts.filter(x=>t-x<30000); sttRestarts.push(t);
    console.log('[stt] mic track ended; restarts in last 30s:', sttRestarts.length);
    sttStop();
    if(sttRestarts.length>3){ laylaEl.textContent='The microphone keeps disconnecting — tap the mic to try again.'; setWake(false); return; }
    setTimeout(()=>{ if(wakeOn) sttStart().catch(()=>{ if(wakeOn) setWake(false); }); }, 1000);
  }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && wakeOn && USE_STT){ try{ ac().resume(); }catch(e){} } });
  function setWake(on){ wakeOn=on;
    if(on && USE_STT){
      micBtn.classList.add('live'); statusEl.textContent='Say “Hey Layla”'; ac().resume&&ac().resume();
      sttStart().catch(err=>{
        console.log('[stt] mic open failed:', err && err.name);
        if(!wakeOn) return;
        laylaEl.textContent = (err && (err.name==='NotAllowedError'||err.name==='SecurityError'))
          ? 'Microphone permission is blocked — allow it in the browser settings, or type below.'
          : 'I could not open the microphone — you can still type below.';
        setWake(false);
      });
      if(state!=='speaking') setState('idle');
      return;
    }
    if(on){ if(!rec)rec=initRec();
      if(!rec){ laylaEl.textContent='Hands-free needs Chrome or Edge — you can still type below.'; wakeOn=false; return; }
      micBtn.classList.add('live'); statusEl.textContent='Say “Hey Layla”'; ac().resume&&ac().resume(); try{rec.start();}catch(e){}
      if(state!=='speaking') setState('idle');
    } else { micBtn.classList.remove('live'); convo=false; clearConvoBuffer(); clearHold(); sttStop();
      try{rec&&rec.stop();}catch(e){} setState('idle'); statusEl.textContent='Idle'; }
  }
  micBtn.addEventListener('click',()=>setWake(!wakeOn));
  $('composer').addEventListener('submit',e=>{e.preventDefault();const v=$('text').value;$('text').value='';if(v.trim())ask(v);});
  addEventListener('pointerdown',function once(){removeEventListener('pointerdown',once);ac().resume&&ac().resume();},{once:true});

  /* ============================ Hamburger drawer — real live state ============================ */
  const PILL_LABEL = {connected:'Connected', disconnected:'Disconnected', offline:'Offline',
    authentication_required:'Auth Required', permission_required:'Permission Required',
    error:'Error', disabled:'Disabled', unknown:'Unknown'};
  function pill(status){ const s=status||'unknown'; return `<span class="pill ${s}">${PILL_LABEL[s]||s}</span>`; }
  function row(name, status, detail){
    return `<div class="row"><span class="row-name">${name}</span>${pill(status)}</div>` +
           (detail?`<div class="row-detail">${detail}</div>`:'');
  }
  function section(icon, title, headStatus, bodyHtml, startOpen){
    return `<div class="dsec${startOpen?' open':''}">
      <div class="dsec-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="dsec-title">${icon} ${title}</span>
        <span style="display:flex;align-items:center;gap:8px">${headStatus?pill(headStatus):''}<span class="dsec-caret">▶</span></span>
      </div>
      <div class="dsec-body">${bodyHtml}</div>
    </div>`;
  }

  async function permissionState(name){
    try{ const p = await navigator.permissions.query({name}); return p.state; }catch(e){ return 'unknown'; }
  }
  // "prompt" = the browser hasn't asked yet (no dialog shown, nothing denied) --
  // that's a permission state, not an auth/credential state, so it must not
  // share a label with "needs a login/API key" (Telegram, Google, etc.).
  const PERM_MAP = {granted:'connected', denied:'disabled', prompt:'permission_required', unknown:'unknown'};

  async function renderDrawer(){
    const body = $('drawerBody');
    let st;
    try{ const r = await fetch('/state'); st = await r.json(); }
    catch(e){ body.innerHTML = '<div class="drawer-loading">Could not reach Layla\'s status endpoint.</div>'; return; }

    const [micP, camP] = await Promise.all([permissionState('microphone'), permissionState('camera')]);

    let html = '';

    // Perception
    html += section('🎙️','Perception', null, `
      ${row('Microphone', PERM_MAP[micP]||'unknown', micP==='prompt'?'Not asked yet — tap the mic button once to grant it':'')}
      ${row('Camera', PERM_MAP[camP]||'unknown', camP==='prompt'?"Not asked yet — that's normal, by design. The browser will prompt the first time you say \"what do you see?\"":'')}
      ${row('Web Access', st.perception.web_access.status, st.perception.web_access.detail)}
    `, true);

    // PC / Phone
    html += section('💻','PC Access', st.pc_access.status, row('This PC', st.pc_access.status, st.pc_access.detail));
    html += section('📱','Phone Access', st.phone_access.status, row('This Phone', st.phone_access.status, st.phone_access.detail));

    // Home
    const relayRows = Object.entries(st.home_control.relays||{}).map(([n,v])=>row(`Relay ${n}`, v==='on'?'connected':'offline','')).join('');
    html += section('🏠','Home Control', st.home_control.status,
      row('Box · '+st.home_control.device_id, st.home_control.status, st.home_control.status==='offline'?'No device has connected yet — see the ESP32 firmware guide':'') + relayRows);

    // Memory
    html += section('🧠','Memory', null, `
      <div class="mini-stat">Conversation: <b>${st.memory.conversation_messages}</b> messages remembered</div>
      <div class="mini-stat">Facts about you: <b>${st.memory.facts_remembered}</b> (${st.memory.facts_semantically_indexed ?? '?'} searchable by meaning)</div>
      <div class="mini-stat">Reminders pending: <b>${st.memory.reminders_pending}</b></div>
    `);

    // Connectors
    const apiRows = st.connectors.apis.map(a=>row(a.name,a.status,a.detail)).join('');
    const mcpRows = st.connectors.mcp.map(m=>row('MCP: '+m.name, m.status,
      m.tools_discovered!=null?`${m.tools_discovered} tool(s) discovered — ${(m.tools||[]).join(', ')}`:(m.detail||''))).join('');
    html += section('🔌','Connectors', null, `<div class="mini-stat" style="padding-left:18px;font-weight:600;color:#8ea0b8">APIs</div>${apiRows}<div class="mini-stat" style="padding-left:18px;font-weight:600;color:#8ea0b8;margin-top:6px">MCP Servers</div>${mcpRows}`, true);

    // Plugins
    html += section('🧩','Plugins', null,
      st.plugins.installed.length ? st.plugins.installed.map(p=>row(p.name,p.status,'')).join('')
        : '<div class="empty-note">No plugins installed yet.</div>');

    // Tools
    const domainRows = Object.entries(st.tools.genesis_by_domain||{}).sort((a,b)=>b[1]-a[1])
      .map(([d,n])=>row(d, n>0?'connected':'disabled', `${n} tool(s) registered`)).join('');
    html += section('🛠️','Tools', null, `
      <div class="mini-stat">Layla can call <b>${st.tools.curated_conversational.length}</b> tools directly in conversation:</div>
      <div style="padding:2px 18px 10px 32px">${st.tools.curated_conversational.map(t=>`<span class="tool-chip">${t}</span>`).join('')}</div>
      <div class="mini-stat">Platform registry: <b>${st.tools.platform_registered_total}</b> tools total, by domain:</div>
      ${domainRows}
    `);

    // Settings
    html += section('⚙️','Settings', null, `
      <div class="mini-stat">Brain: <b>${st.settings.model}</b></div>
      <div class="mini-stat">Fallback brain: <b>${st.settings.fallback_model}</b></div>
      <div class="mini-stat">Vision: <b>${st.settings.vision_model}</b></div>
      <div class="mini-stat">OCR (text reading): <b>${st.settings.ocr_model}</b></div>
      <div class="mini-stat">Embeddings (semantic memory): <b>${st.settings.embedding_model}</b></div>
      <div class="mini-stat">Voice: <b>${st.settings.voice}</b></div>
    `);

    body.innerHTML = html;
  }

  function openDrawer(){ $('drawer').classList.add('open'); $('scrim').classList.add('open'); renderDrawer(); }
  function closeDrawer(){ $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); }
  $('hamburger').addEventListener('click', openDrawer);
  $('drawerClose').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  $('refreshState').addEventListener('click', async (e)=>{
    e.target.classList.add('spinning'); e.target.textContent='↻ Checking…';
    try{ const r=await fetch('/state?refresh=1'); const st=await r.json(); await renderDrawer(); }
    finally{ e.target.classList.remove('spinning'); e.target.textContent='↻ Refresh status'; }
  });

  /* ================= server->browser push (SSE) =================
     The live channel Layla uses to reach the screen on her own:
     proactive greeting, alerts, door-cam switch, dashboard updates.
     EventSource auto-reconnects, so this survives restarts/drops. */
  (function(){
    function connectSSE(){
      let es;
      try{ es = new EventSource('/events'); }
      catch(e){ setTimeout(connectSSE, 5000); return; }
      es.onmessage = async (ev)=>{
        let m; try{ m = JSON.parse(ev.data); }catch(_){ return; }
        const t = m.type || '';
        if(t==='greeting' || t==='notify' || t==='say'){
          const text = m.text || ''; if(!text) return;
          if(busy) return;                 // never talk over an in-progress turn
          if(laylaEl) laylaEl.textContent = text;
          try{ await speak(text, m.tone || 'warm'); }catch(_){}
        } else if(t==='show_camera'){ try{ window.__layla_showCamera && window.__layla_showCamera(m); }catch(_){}
        } else if(t==='hide_camera'){ try{ window.__layla_hideCamera && window.__layla_hideCamera(); }catch(_){}
        } else if(t==='screen'){ try{ window.__layla_screen && window.__layla_screen(m); }catch(_){}
        } else if(t==='approval'){ try{ window.__layla_approval && window.__layla_approval(m); }catch(_){}
        } else if(t==='approval_closed'){ try{ window.__layla_approval_close && window.__layla_approval_close(m.id); }catch(_){}
        } else if(t==='open_panel' && m.panel==='globe'){ try{ window.__layla_open_globe && window.__layla_open_globe(m); }catch(_){}
        }
      };
      es.onerror = ()=>{ /* browser auto-reconnects the EventSource */ };
    }
    connectSSE();
  })();

  /* ============ live camera overlay (door cam on screen) ============
     Fills in the __layla_showCamera / __layla_hideCamera hooks the SSE
     dispatcher already calls. Self-contained: builds its own DOM so it
     can't collide with the avatar canvas or the HUD.

     The stream is served from Layla's OWN origin as multipart MJPEG
     (/doorcam/stream). It deliberately does NOT point at the camera's LAN
     address: this page is HTTPS, so an http://192.168.x.x source would be
     blocked as mixed content. */
  (function(){
    var wrap = null, imgEl = null, hideTimer = null;

    function build(){
      if(wrap) return;
      wrap = document.createElement('div');
      wrap.id = 'layla-cam';
      wrap.setAttribute('role','dialog');
      wrap.setAttribute('aria-label','Live camera');
      wrap.style.cssText = [
        'position:fixed','z-index:99999','right:18px','bottom:18px',
        'width:min(46vw,520px)','background:#0b0d12',
        'border:1px solid rgba(255,255,255,.18)','border-radius:14px',
        'box-shadow:0 18px 48px rgba(0,0,0,.55)','overflow:hidden',
        'font-family:inherit','display:none'
      ].join(';');

      var bar = document.createElement('div');
      bar.style.cssText = [
        'display:flex','align-items:center','gap:8px',
        'padding:8px 10px','background:rgba(255,255,255,.06)',
        'font-size:12px','letter-spacing:.08em','text-transform:uppercase',
        'color:#cfd6e4'
      ].join(';');

      var dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#ff4d4f;box-shadow:0 0 8px #ff4d4f';

      var title = document.createElement('span');
      title.id = 'layla-cam-title';
      title.textContent = 'Live';
      title.style.cssText = 'flex:1';

      var close = document.createElement('button');
      close.type = 'button';
      close.textContent = '\u2715';
      close.setAttribute('aria-label','Close camera');
      close.style.cssText = [
        'all:unset','cursor:pointer','padding:2px 6px','border-radius:6px',
        'color:#cfd6e4','font-size:14px','line-height:1'
      ].join(';');
      close.addEventListener('click', hide);

      bar.appendChild(dot); bar.appendChild(title); bar.appendChild(close);

      imgEl = document.createElement('img');
      imgEl.alt = 'Live camera feed';
      imgEl.style.cssText = 'display:block;width:100%;height:auto;background:#000;min-height:120px';
      imgEl.addEventListener('error', function(){
        title.textContent = 'Feed unavailable';
      });

      wrap.appendChild(bar); wrap.appendChild(imgEl);
      document.body.appendChild(wrap);
    }

    function show(m){
      build();
      m = m || {};
      document.getElementById('layla-cam-title').textContent = m.title || 'Live';
      // cache-bust so a reconnect starts a fresh multipart response
      imgEl.src = (m.url || '/doorcam/stream') + '?t=' + Date.now();
      wrap.style.display = 'block';
      if(hideTimer) clearTimeout(hideTimer);
      // Don't leave the uplink running forever if nobody closes it.
      hideTimer = setTimeout(hide, (m.seconds ? m.seconds * 1000 : 120000));
    }

    function hide(){
      if(hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
      if(!wrap) return;
      wrap.style.display = 'none';
      if(imgEl) imgEl.src = '';   // drops the HTTP connection -> server stops the uplink
    }

    window.__layla_showCamera = show;
    window.__layla_hideCamera = hide;
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') hide();
    });
  })();
  /* ============ approval cards (CAPS-3-11) ============
     Anything that reaches outside Layla (a message to another person) waits
     for an explicit Allow here or a spoken yes. Nothing is sent from a card
     the owner didn't tap. */
  (function(){
    const box=document.createElement('div');
    box.style.cssText='position:fixed;top:70px;right:18px;z-index:99998;display:flex;flex-direction:column;gap:10px;width:min(360px,90vw)';
    document.body.appendChild(box);
    const cards={};
    function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
    window.__layla_approval=function(m){
      if(!m||!m.id||cards[m.id]) return;
      const c=document.createElement('div');
      c.style.cssText='background:#0b0f16;border:1px solid rgba(53,224,200,.45);border-radius:12px;padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.6);color:#e9edf4;font-size:13.5px';
      c.innerHTML='<div style="font-weight:700;color:#35e0c8;margin-bottom:6px">'+esc(m.title)+'</div>'+
        '<div style="white-space:pre-wrap;color:#c8ceda;max-height:160px;overflow:auto;margin-bottom:10px">'+esc(m.detail)+'</div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end"><button data-a="0" style="background:none;border:1px solid #3a4352;color:#c8ceda;border-radius:8px;padding:7px 14px;cursor:pointer">Deny</button>'+
        '<button data-a="1" style="background:#35e0c8;border:none;color:#04120f;font-weight:700;border-radius:8px;padding:7px 16px;cursor:pointer">Allow</button></div>';
      c.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{
        c.style.opacity='.5'; c.querySelectorAll('button').forEach(x=>x.disabled=true);
        try{ await fetch('/approval/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,allow:b.dataset.a==='1'})}); }catch(e){}
        window.__layla_approval_close(m.id);
      }));
      cards[m.id]=c; box.appendChild(c); chime(true);
      setTimeout(()=>window.__layla_approval_close(m.id), ((m.expires_in||600)+5)*1000);
    };
    window.__layla_approval_close=function(id){ const c=cards[id]; if(c){ c.remove(); delete cards[id]; } };
    fetch('/approval/pending').then(r=>r.ok?r.json():[]).then(l=>(l||[]).forEach(window.__layla_approval)).catch(()=>{});
  })();

  /* ============ Planetary Intelligence / God's Eye View Globe Panel ============
     Embeds the live interactive 3D globe visualization whenever an SSE open_panel
     event is pushed from Layla's planetary intelligence tools. */
  (function(){
    var panel = null, iframeEl = null, titleEl = null, linkEl = null, summaryEl = null, bodyWrap = null;
    var isMinimized = false;

    function build(){
      if(panel) return;
      panel = document.createElement('div');
      panel.id = 'layla-globe-panel';
      panel.setAttribute('role', 'dialog');
      panel.setAttribute('aria-label', "God's Eye View 3D Globe");
      panel.style.cssText = [
        'position:fixed', 'z-index:99995', 'right:18px', 'bottom:18px',
        'width:min(860px, 92vw)', 'height:min(580px, 78vh)', 'background:#080b11',
        'border:1px solid rgba(53,224,200,.45)', 'border-radius:14px',
        'box-shadow:0 24px 64px rgba(0,0,0,.75)', 'overflow:hidden',
        'display:none', 'flex-direction:column', 'font-family:inherit',
        'transition:height 0.25s ease, width 0.25s ease'
      ].join(';');

      // Top control bar
      var bar = document.createElement('div');
      bar.style.cssText = [
        'display:flex', 'align-items:center', 'gap:10px',
        'padding:10px 14px', 'background:rgba(20,27,38,.9)',
        'border-bottom:1px solid rgba(53,224,200,.2)', 'user-select:none'
      ].join(';');

      var dot = document.createElement('span');
      dot.style.cssText = 'width:9px;height:9px;border-radius:50%;background:#35e0c8;box-shadow:0 0 10px #35e0c8;flex-shrink:0';

      titleEl = document.createElement('span');
      titleEl.textContent = "God's Eye View";
      titleEl.style.cssText = 'font-weight:700;font-size:13px;letter-spacing:.05em;color:#35e0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1';

      linkEl = document.createElement('a');
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.textContent = 'Full Screen ↗';
      linkEl.style.cssText = [
        'color:#c8ceda', 'text-decoration:none', 'font-size:12px', 'padding:3px 8px',
        'border:1px solid rgba(255,255,255,.15)', 'border-radius:6px',
        'background:rgba(255,255,255,.05)', 'white-space:nowrap', 'cursor:pointer'
      ].join(';');
      linkEl.addEventListener('mouseenter', function(){ linkEl.style.color = '#35e0c8'; linkEl.style.borderColor = '#35e0c8'; });
      linkEl.addEventListener('mouseleave', function(){ linkEl.style.color = '#c8ceda'; linkEl.style.borderColor = 'rgba(255,255,255,.15)'; });

      var minBtn = document.createElement('button');
      minBtn.type = 'button';
      minBtn.textContent = '—';
      minBtn.setAttribute('aria-label', 'Minimize globe');
      minBtn.style.cssText = 'all:unset;cursor:pointer;padding:2px 8px;border-radius:6px;color:#c8ceda;font-size:13px;line-height:1';
      minBtn.addEventListener('click', toggleMinimize);

      var closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.textContent = '✕';
      closeBtn.setAttribute('aria-label', 'Close globe');
      closeBtn.style.cssText = 'all:unset;cursor:pointer;padding:2px 8px;border-radius:6px;color:#c8ceda;font-size:14px;line-height:1';
      closeBtn.addEventListener('click', hide);

      bar.appendChild(dot);
      bar.appendChild(titleEl);
      bar.appendChild(linkEl);
      bar.appendChild(minBtn);
      bar.appendChild(closeBtn);

      bodyWrap = document.createElement('div');
      bodyWrap.style.cssText = 'flex:1;display:flex;flex-direction:column;min-height:0;position:relative';

      summaryEl = document.createElement('div');
      summaryEl.style.cssText = [
        'padding:6px 14px', 'background:rgba(12,17,25,.8)',
        'font-size:12px', 'color:#c8ceda', 'border-bottom:1px solid rgba(255,255,255,.08)',
        'white-space:nowrap', 'overflow:hidden', 'text-overflow:ellipsis', 'display:none'
      ].join(';');

      iframeEl = document.createElement('iframe');
      iframeEl.setAttribute('allow', 'fullscreen; geolocation; accelerometer; gyroscope');
      iframeEl.style.cssText = 'flex:1;width:100%;border:none;background:#05070a';

      bodyWrap.appendChild(summaryEl);
      bodyWrap.appendChild(iframeEl);

      panel.appendChild(bar);
      panel.appendChild(bodyWrap);
      document.body.appendChild(panel);
    }

    function toggleMinimize(){
      if(!panel) return;
      isMinimized = !isMinimized;
      if(isMinimized){
        bodyWrap.style.display = 'none';
        panel.style.height = 'auto';
        panel.style.width = 'min(380px, 90vw)';
      } else {
        bodyWrap.style.display = 'flex';
        panel.style.height = 'min(580px, 78vh)';
        panel.style.width = 'min(860px, 92vw)';
      }
    }

    function show(m){
      build();
      m = m || {};
      var targetUrl = m.url || 'http://103.168.22.202:4173/?embed=1';
      titleEl.textContent = m.title || "Planetary Intelligence (God's Eye View)";
      linkEl.href = targetUrl.replace('?embed=1&', '?').replace('?embed=1', '');

      if(m.summary){
        summaryEl.textContent = m.summary;
        summaryEl.style.display = 'block';
      } else {
        summaryEl.style.display = 'none';
      }

      if(iframeEl.src !== targetUrl){
        iframeEl.src = targetUrl;
      }

      isMinimized = false;
      bodyWrap.style.display = 'flex';
      panel.style.height = 'min(580px, 78vh)';
      panel.style.width = 'min(860px, 92vw)';
      panel.style.display = 'flex';

      try{ if(typeof chime === 'function') chime(true); }catch(_){}
    }

    function hide(){
      if(!panel) return;
      panel.style.display = 'none';
      if(iframeEl) iframeEl.src = 'about:blank';
    }

    window.__layla_open_globe = show;
    window.__layla_close_globe = hide;
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && panel && panel.style.display !== 'none'){
        hide();
      }
    });
  })();
  </script>
</body>
