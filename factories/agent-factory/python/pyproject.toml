[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avishkar-agent"
version = "0.1.0"
description = "Agent Framework -- Python reference implementation for Avishkar OS (Chief Domain Agent runtime: reasoning loop, memory, tools, thinking models, Orchestrator)."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Avishkar Labs" }]
dependencies = [
    "avishkar-core",
    "avishkar-router",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["avishkar_agent*"]
