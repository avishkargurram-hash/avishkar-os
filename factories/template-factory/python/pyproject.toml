[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avishkar-template"
version = "0.1.0"
description = "Template Framework -- reusable document/project templates for Avishkar OS."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Avishkar Labs" }]
dependencies = ["avishkar-core", "avishkar-prompt"]
# Stdlib-only (pathlib for instantiation); avishkar-prompt depended on to
# reuse PromptVersion/PromptVariable/render() verbatim -- see CONTRACT.md SS0.

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["avishkar_template*"]
