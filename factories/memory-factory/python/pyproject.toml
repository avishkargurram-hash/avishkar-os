[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avishkar-memory"
version = "0.1.0"
description = "Memory Framework -- real, persistent MemoryPolicy backends for Avishkar OS (file, SQLite)."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Avishkar Labs" }]
dependencies = ["avishkar-core", "avishkar-agent"]
# Both backends are stdlib-only (json/pathlib, sqlite3) -- zero third-
# party dependencies, same discipline core/ set.

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["avishkar_memory*"]
