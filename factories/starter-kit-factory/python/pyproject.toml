[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avishkar-starter-kit"
version = "0.1.0"
description = "Starter Kit Framework -- clone-and-go starter kits composing Avishkar OS building blocks for Avishkar OS."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Avishkar Labs" }]
dependencies = ["avishkar-core", "avishkar-agent", "avishkar-template"]
# Stdlib-only (json/pathlib for the blueprint manifest + delegated
# instantiation); avishkar-template depended on to reuse instantiate()
# verbatim rather than reimplementing file-writing.

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["avishkar_starter_kit*"]
