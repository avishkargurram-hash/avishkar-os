plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'in.tryvanta.laylavoice'
    compileSdk 33

    signingConfigs {
        release {
            storeFile file("layla_release.keystore")
            storePassword "layla123"
            keyAlias "layla"
            keyPassword "layla123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "in.tryvanta.laylavoice"
        minSdk 24
        targetSdk 33
        versionCode 4
        versionName "0.4"
        // Personal build: pre-fill the owner device token from the gitignored .secrets/ file (empty if absent).
        def tokFile = new File(rootDir, '.secrets/device_token.txt')
        def tok = tokFile.exists() ? tokFile.text.trim() : ''
        buildConfigField 'String', 'DEFAULT_TOKEN', '"' + tok + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
}

tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask).configureEach {
    enabled = false
}
