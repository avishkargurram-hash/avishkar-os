plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}


def phoneProps = new Properties()
def phoneFile = rootProject.file('phone.properties')    // gitignored: holds the Phone Agent MQTT password
if (phoneFile.exists()) {
    phoneFile.withInputStream { phoneProps.load(it) }
}

android {
    namespace 'in.tryvanta.laylaphone'
    compileSdk 36

    defaultConfig {
        applicationId "in.tryvanta.laylaphone"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0"
        buildConfigField "String", "PHONE_MQTT_PASS", "\"${phoneProps.getProperty('mqtt_pass', '')}\""
    }
    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    // Core MQTT client only -- deliberately NOT the deprecated
    // org.eclipse.paho.android.service wrapper. It runs fine inside our own
    // plain foreground Service; the wrapper adds a second bound-service layer
    // this app doesn't need and that library hasn't been maintained in years.
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
