plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

def waProps = new Properties()
def waFile = rootProject.file('wa.properties')
if (waFile.exists()) {
    waFile.withInputStream { waProps.load(it) }
}

android {
    namespace 'in.tryvanta.laylawa'
    compileSdk 36

    defaultConfig {
        applicationId "in.tryvanta.laylawa"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "WA_BASE", "\"${waProps.getProperty('base', '')}\""
        buildConfigField "String", "WA_TOKEN", "\"${waProps.getProperty('token', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
