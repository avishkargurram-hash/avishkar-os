[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avishkar-scientist"
version = "1.0.0"
description = "Scientist OS -- durable autonomous scientific research subsystem for Avishkar OS (Megha persona, delegated by Layla)."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Avishkar Labs" }]
# avishkar-router (+ avishkar-core) provide the provider layer and fallback
# chains -- Scientist OS adds tiers/budgets/caches on top, never a second router.
dependencies = [
    "avishkar-core",
    "avishkar-router",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sci = "avishkar_scientist.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["avishkar_scientist*"]

[tool.setuptools.package-data]
avishkar_scientist = ["storage/migrations/*.sql", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a reachable Postgres+pgvector (SCI_TEST_DATABASE_URL)",
    "live: calls real external services (network); opt-in via SCI_LIVE=1",
]
